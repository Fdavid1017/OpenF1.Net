name: Publish NuGet Package

# Stable (master) releases are handled by the release.yml workflow (git-cliff + tag);
# this one only builds prerelease packages from the develop branch.
on:
  push:
    branches:
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The next stable version computed from the commits (e.g. v0.2.0)
      - name: Resolve next version
        id: version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version

      # The package's releaseNotes field is built from the commits since the last tag
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      # Prerelease version: <next stable>-dev.<timestamp>, e.g. 0.2.0-dev.20260825171044
      - name: Compose prerelease version
        id: pack_version
        run: |
          NEXT="$(echo '${{ steps.version.outputs.content }}' | tr -d '[:space:]')"
          NEXT="${NEXT#v}"
          echo "value=${NEXT}-dev.$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.pack_version.outputs.value }}

      - name: Pack (Develop - Prerelease)
        run: dotnet pack OpenF1.Net.csproj --configuration Release --no-build --output ./nupkg -p:Version=${{ steps.pack_version.outputs.value }}

      - name: Push to GitHub Packages
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
