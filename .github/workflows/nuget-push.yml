name: Publish NuGet Package

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build --configuration Release

      # Develop ágon automatikusan hozzáad egy dev.X suffixes verziót (pl. 1.0.0-dev.12)
      - name: Pack (Develop - Prerelease)
        if: github.ref == 'refs/heads/develop'
        run: dotnet pack --configuration Release --no-build --output ./nupkg --version-suffix "dev.${{ github.run_number }}"

      # Master ágon a stabil verziót csomagolja
      - name: Pack (Master - Release)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads'
        run: dotnet pack --configuration Release --no-build --output ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate